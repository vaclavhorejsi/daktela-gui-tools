name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:

  # ── Linux X11 (WebKitGTK 4.0, Ubuntu 22.04) ───────────────────────────────
  build-linux-x11:
    name: Linux X11
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build
        run: wails build -o daktela-gui-tools

      - uses: actions/upload-artifact@v4
        with:
          name: daktela-gui-tools-linux-x11
          path: build/bin/daktela-gui-tools

  # ── Linux Wayland (WebKitGTK 4.1, Ubuntu 24.04) ───────────────────────────
  build-linux-wayland:
    name: Linux Wayland
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build
        run: wails build -tags webkit2_41 -o daktela-gui-tools-wayland

      - uses: actions/upload-artifact@v4
        with:
          name: daktela-gui-tools-linux-wayland
          path: build/bin/daktela-gui-tools-wayland

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build
        run: wails build -o daktela-gui-tools-darwin

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/bin/daktela-gui-tools.app build/bin/daktela-gui-tools-darwin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: daktela-gui-tools-macos
          path: build/bin/daktela-gui-tools-darwin.zip

  # ── GitHub Release (jen při tagu v*) ──────────────────────────────────────
  release:
    name: Release
    needs: [build-linux-x11, build-linux-wayland, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/daktela-gui-tools-linux-x11/daktela-gui-tools
            artifacts/daktela-gui-tools-linux-wayland/daktela-gui-tools-wayland
            artifacts/daktela-gui-tools-macos/daktela-gui-tools-darwin.zip
